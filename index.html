<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherCAD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-background: #121212;
        --color-surface: #1e1e1e;
        --color-primary: #bb86fc;
        --color-secondary: #03dac6;
        --color-on-background: #e0e0e0;
        --color-on-surface: #ffffff;
        --color-border: #333333;
        --font-family: "Poppins", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--color-background);
        color: var(--color-on-background);
      }

      #root {
        display: flex;
        flex-direction: column;
      }

      .app-container {
        display: flex;
        flex-grow: 1;
        height: calc(100% - 80px); /* Full height minus prompt bar */
      }
      
      .viewport-container {
        flex-grow: 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--color-background);
      }

      .parameters-panel {
        width: 320px;
        flex-shrink: 0;
        background-color: var(--color-surface);
        border-left: 1px solid var(--color-border);
        padding: 24px;
        overflow-y: auto;
      }

      .prompt-bar-container {
        height: 80px;
        flex-shrink: 0;
        border-top: 1px solid var(--color-border);
        background-color: var(--color-surface);
        padding: 16px;
        display: flex;
        align-items: center;
      }

      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        flex-direction: column;
        gap: 1rem;
      }
      
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid var(--color-primary);
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.13.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.6.1",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.3.0",
    "three": "https://esm.sh/three@^0.179.1",
    "lucide-react": "https://esm.sh/lucide-react@0.395.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
