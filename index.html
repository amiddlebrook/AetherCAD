<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherCAD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-background: #121212;
        --color-surface: #1e1e1e;
        --color-primary: #bb86fc;
        --color-secondary: #03dac6;
        --color-on-background: #e0e0e0;
        --color-on-surface: #ffffff;
        --color-border: #333333;
        --font-family: "Poppins", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--color-background);
        color: var(--color-on-background);
      }

      #root {
        display: flex;
        flex-direction: column;
      }

      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        background: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
        font-weight: 600;
        color: var(--color-on-surface);
        height: 50px;
        flex-shrink: 0;
      }

      .export-button {
        background: none;
        border: 1px solid var(--color-primary);
        color: var(--color-primary);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-family);
        font-size: 0.9rem;
        transition: background-color 0.2s, color 0.2s;
      }

      .export-button:hover:not(:disabled) {
        background-color: var(--color-primary);
        color: #121212;
      }

      .export-button:disabled {
        border-color: var(--color-border);
        color: #555;
        cursor: not-allowed;
      }


      .app-container {
        display: flex;
        flex-grow: 1;
        height: calc(100% - 50px - 80px); /* Full height minus header and prompt bar */
      }
      
      .viewport-container {
        flex-grow: 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--color-background);
      }

      .parameters-panel {
        width: 320px;
        flex-shrink: 0;
        background-color: var(--color-surface);
        border-left: 1px solid var(--color-border);
        padding: 24px;
        overflow-y: auto;
      }

      .panel-summary {
        font-weight: 600;
        cursor: pointer;
        padding: 10px 0;
        color: var(--color-on-surface);
        border-bottom: 1px solid var(--color-border);
        margin-bottom: 1rem;
        list-style: none; /* Hide default marker */
      }
      .panel-summary::-webkit-details-marker {
        display: none; /* Hide default marker for Chrome/Safari */
      }

      .panel-summary::before {
        content: '►';
        margin-right: 8px;
        font-size: 0.8em;
        display: inline-block;
        transition: transform 0.2s;
      }

      details[open] > .panel-summary::before {
        transform: rotate(90deg);
      }

      .panel-content {
        padding-left: 10px;
      }

      .prompt-bar-container {
        height: 80px;
        flex-shrink: 0;
        border-top: 1px solid var(--color-border);
        background-color: var(--color-surface);
        padding: 16px;
        display: flex;
        align-items: center;
      }

      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        flex-direction: column;
        gap: 1rem;
      }
      
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid var(--color-primary);
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.13.0",
    "react": "https://esm.sh/react@^18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@^18.2.0/client",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^9.102.6",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^8.15.11",
    "three": "https://esm.sh/three@^0.160.0",
    "three/addons/": "https://esm.sh/three@^0.160.0/examples/jsm/",
    "three-csg-ts": "https://esm.sh/three-csg-ts@^3.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.395.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "three/": "https://esm.sh/three@^0.179.1/",
    "react/": "https://esm.sh/react@^19.1.1/"
  }
}
</script>

</head>

  <script type="module" src="/index.tsx"></script>

</html>
